<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add link — Matheus Rocha</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow-x: initial; }
    .admin {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px var(--padding-x);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .admin h1 {
      font-family: var(--font);
      font-size: 16px;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .field input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: max(16px, 14px);
      padding: 10px 12px;
      outline: none;
    }
    .field input:focus { border-color: var(--text-muted); }
    .admin button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0.02em;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .admin button:hover { background: var(--hover-bg); }
    .admin button:disabled { opacity: 0.5; cursor: default; }
    .status { font-size: 12px; line-height: 1.5; min-height: 1.5em; white-space: pre-line; }
    .status.error { color: #e02020; }
    .status.ok { color: #6fbf73; }
    .status .row { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="admin">
    <h1>add link</h1>

    <div class="field">
      <label for="url">url</label>
      <input type="url" id="url" placeholder="https://..." autocomplete="off" required>
    </div>

    <div class="field">
      <label for="date">date (mm/yyyy)</label>
      <input type="text" id="date" placeholder="09/2026" autocomplete="off">
    </div>

    <div class="field">
      <label for="password">password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>

    <button id="submit">add</button>
    <div class="status" id="status"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
