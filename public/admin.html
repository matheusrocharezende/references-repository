<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Add link — Matheus Rocha</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { overflow-x: initial; }

    .screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
    }

    [hidden] { display: none !important; }

    /* ── login ── */
    .mark {
      width: 8px;
      height: 8px;
      background: #e02020;
      border-radius: 50%;
    }

    .login-card {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-title {
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-primary);
      letter-spacing: 0.02em;
      text-align: center;
    }

    .field { display: flex; flex-direction: column; gap: 8px; }

    .field label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .field input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: max(16px, 14px);
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: var(--text-muted); }

    .login-card button {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 14px;
      letter-spacing: 0.02em;
      padding: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .login-card button:hover { background: var(--hover-bg); border-color: var(--text-muted); }
    .login-card button:disabled { opacity: 0.5; cursor: default; }

    .login-error {
      font-size: 11px;
      color: #e02020;
      text-align: center;
      min-height: 1em;
    }

    /* ── add-link (post login) ── */
    .add-screen {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      outline: none;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: max(16px, 16px);
      letter-spacing: 0.01em;
      padding: 8px 0;
      text-align: center;
      transition: border-color 0.15s;
    }

    .link-input::placeholder { color: var(--text-muted); }
    .link-input:focus { border-color: var(--text-muted); }

    .add-status {
      font-size: 12px;
      line-height: 1.5;
      min-height: 1.5em;
      white-space: pre-line;
      text-align: center;
    }

    .add-status.error { color: #e02020; }
    .add-status.ok { color: #6fbf73; }
    .add-status.warn { color: #d4a441; }
  </style>
</head>
<body>

  <section class="screen" id="loginScreen">
    <div class="mark"></div>
    <div class="login-card">
      <div class="login-title">sign in</div>
      <div class="field">
        <label for="password">password</label>
        <input type="password" id="password" autocomplete="current-password" autofocus>
      </div>
      <button id="signInBtn">sign in</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </section>

  <section class="screen" id="addScreen" hidden>
    <div class="add-screen">
      <input type="url" class="link-input" id="url" placeholder="paste a link and press enter" autocomplete="off">
      <div class="add-status" id="status"></div>
    </div>
  </section>

  <script src="admin.js"></script>
</body>
</html>
